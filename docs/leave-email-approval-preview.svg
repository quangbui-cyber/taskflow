<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18181b; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; fill: #52525b; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #71717a; }
      .button { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .step { font-size: 15px; font-weight: 700; fill: #1d4ed8; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#f5f7fb"/>
  <text x="54" y="56" class="title">Duyệt đơn nghỉ từ email — bản phác giao diện</text>
  <text x="54" y="83" class="small">Người duyệt nhận email → mở trang xác nhận → app cập nhật trạng thái và thông báo kết quả</text>

  <text x="54" y="130" class="step">1  EMAIL NGƯỜI DUYỆT</text>
  <rect x="54" y="151" width="412" height="636" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="82" y="193" class="small">Từ: myCreative</text>
  <text x="82" y="219" class="small">Chủ đề: Đơn xin nghỉ mới — Nguyễn Văn A</text>
  <line x1="82" x2="438" y1="238" y2="238" stroke="#e4e4e7"/>
  <text x="82" y="273" class="small">NGHỈ PHÉP</text>
  <text x="82" y="306" class="heading">Đơn xin nghỉ mới</text>
  <text x="82" y="348" class="label">Người xin nghỉ</text>
  <text x="238" y="348" class="body">Nguyễn Văn A</text>
  <text x="82" y="385" class="label">Loại nghỉ</text>
  <text x="238" y="385" class="body">Nghỉ phép năm</text>
  <text x="82" y="422" class="label">Thời gian</text>
  <text x="238" y="422" class="body">26/10 – 27/10/2026</text>
  <text x="82" y="459" class="label">Số ngày</text>
  <text x="238" y="459" class="body">2 ngày</text>
  <text x="82" y="496" class="label">Lý do</text>
  <text x="238" y="496" class="body">Việc gia đình</text>
  <rect x="82" y="525" width="356" height="48" rx="8" fill="#fef9c3"/>
  <text x="101" y="555" class="body" fill="#713f12">Trạng thái: Chờ duyệt</text>
  <rect x="82" y="603" width="166" height="52" rx="8" fill="#1d4ed8"/>
  <text x="141" y="636" class="button">Duyệt</text>
  <rect x="260" y="603" width="178" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="309" y="636" font-size="17" font-weight="700" fill="#b91c1c">Từ chối</text>
  <text x="82" y="694" class="small">Hai nút mở trang xác nhận trong app.</text>
  <text x="82" y="719" class="small">Email cũng có liên kết “Xem đơn nghỉ”.</text>

  <path d="M480 459 H510" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="526" y="130" class="step">2  TRANG XÁC NHẬN TRONG APP</text>
  <rect x="526" y="151" width="412" height="636" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="526" y="151" width="412" height="72" rx="18" fill="#f8fafc"/>
  <rect x="526" y="204" width="412" height="19" fill="#f8fafc"/>
  <text x="556" y="196" font-size="20" font-weight="700" fill="#1d4ed8">myCreative</text>
  <text x="556" y="269" class="small">ĐƠN NGHỈ PHÉP</text>
  <text x="556" y="308" class="heading">Xác nhận duyệt đơn</text>
  <text x="556" y="345" class="body">Nguyễn Văn A • 26/10 – 27/10/2026</text>
  <text x="556" y="378" class="body">Nghỉ phép năm • 2 ngày</text>
  <line x1="556" x2="908" y1="409" y2="409" stroke="#e4e4e7"/>
  <text x="556" y="449" class="label">Ghi chú cho người xin nghỉ</text>
  <rect x="556" y="467" width="352" height="106" rx="9" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="573" y="497" class="small">Không bắt buộc</text>
  <rect x="556" y="604" width="352" height="52" rx="8" fill="#1d4ed8"/>
  <text x="658" y="637" class="button">Xác nhận duyệt</text>
  <text x="556" y="691" class="small">Chỉ người có quyền duyệt mới thực hiện được.</text>
  <text x="556" y="716" class="small">Nếu chọn “Từ chối”, tiêu đề và nút đổi tương ứng.</text>

  <path d="M952 459 H982" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="998" y="130" class="step">3  KẾT QUẢ</text>
  <rect x="998" y="151" width="388" height="636" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="1192" cy="296" r="43" fill="#dcfce7"/>
  <path d="M1173 296 L1186 309 L1212 283" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1094" y="378" class="heading">Đã duyệt đơn nghỉ</text>
  <text x="1033" y="420" class="body">Trạng thái trong app được cập nhật.</text>
  <text x="1054" y="450" class="body">Người xin nghỉ nhận thông báo</text>
  <text x="1114" y="480" class="body">và email kết quả.</text>
  <rect x="1032" y="538" width="320" height="72" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1053" y="569" class="small">Trạng thái đơn</text>
  <text x="1053" y="595" font-size="18" font-weight="700" fill="#15803d">Đã duyệt</text>
  <text x="1032" y="682" class="small">Nếu đơn đã xử lý hoặc bị hủy, app hiển thị</text>
  <text x="1032" y="706" class="small">trạng thái hiện tại và không xử lý lần hai.</text>

  <text x="54" y="839" class="small">Minh họa đề xuất — chưa thay đổi luồng thực tế trong app.</text>
</svg>
